	<script>
		//Global variables passed to functions as arguments...
		const container = document.querySelector(".Container");
		const fieldset = document.createElement("fieldset");
		
		//INFO: Proccessing, Rendering, Mapping, Research, Storing 
		const obj = {
			0:{
			"name": "Information",
			"value": "Javascript",
			"id": "Javascript"
			},
			1:{
			"name": "Information",
			"value": "Hyper Text Markup Language",
			"id": "Hyper Text Markup Language"
			},
			2:{
			"name": "Information",
			"value": "Cascading Style Sheets",
			"id": "Cascading Style Sheets"
			},
			3:{
			"name": "Information",
			"value": "Machine Learning",
			"id": "Machine Learning"
			},
			4:{
			"name": "Information",
			"value": "Database Design",
			"id": "Database Design"
			}

		}//end JSON
		
		//Needs addEventListner for submit
		//Needs function to remove from DOM TREE
		//Needs function to render new

		//Programatically creates elements
		function RadioButton(obj,container,fieldset){
			//Needs legned, and label and position it.
			
			for(const key in obj){
			//x of y radio buttons
			const divGroup = document.createElement("div");
			const lbl = document.createElement("label");
			const inputText = document.createElement("input");
			inputText.type = "radio";
			inputText.name = obj[key].name;
			inputText.value = obj[key].value;
			inputText.id = obj[key].id;
			inputText.color= "blue";
			inputText.position = "absolute";
			inputText.justifyContent = "center";
			inputText.flexDirection = "flex-end";
			inputText.display = "inline-block";
			
			//Operating on divs?

			lbl.innerText = obj[key].id;
			fieldset.appendChild(divGroup);//five times
			divGroup.appendChild(inputText);//5 times
			divGroup.appendChild(lbl);
			}//end loop

			const lgd = document.createElement("legend");
			lgd.innerText = "Task Programmer";
			fieldset.appendChild(lgd);
			container.appendChild(fieldset);

			//Create Button for submission
			const buttonSubmit = document.createElement("input");
			buttonSubmit.width ="13px";
			buttonSubmit.height ="13px";
			buttonSubmit.color = "green";
			buttonSubmit.justifyContent = "center";
			buttonSubmit.position = "absolute";
			buttonSubmit.type = "button";
			buttonSubmit.value = "Submit";
			buttonSubmit.name = "uptime";
			buttonSubmit.flexDirection = "flex-end";
			buttonSubmit.display = "inline-bock";
			buttonSubmit.classList.add("Uptime");
			
			container.appendChild(buttonSubmit);

		}//end function


		// run functions ...
		RadioButton(obj,container,fieldset);
	</script>
